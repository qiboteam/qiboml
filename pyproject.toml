[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "qiboml"
version = "0.1.2"
description = "Quantum Machine Learning using Qibo"
authors = ["Qiboteam"]
readme = "README.md"
homepage = "https://qibo.science/"
repository = "https://github.com/qiboteam/qiboml/"
documentation = "https://qibo.science/docs/qiboml/stable"
packages = [{ include = "qiboml", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "^2.0.0"
qibo = "^0.3.7"
qibocal = { git = "https://github.com/qiboteam/qibocal", optional = true }
jax = { version = "^0.12.0", optional = true }
jaxlib = { version = "^0.12.0", optional = true }
keras = { version = "^3.13.1", optional = true }
# The stable releases of tensorflow do not support Python 3.14 yet
tensorflow = { version = "^2.21.0", markers = "python_version < '3.14'", optional = true }
torch = { version = "^2.15.0", optional = true }

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^5.3.0"
furo = "^2023.3.27"
sphinxcontrib-bibtex = "^2.5.0"
sphinx-copybutton = "^0.5.2"
sphinxcontrib-katex = "^0.9.9"
recommonmark = "^0.7.1"
nbsphinx = "^0.9.6"
setuptools = ">=78.1.1,<84.0.0"
ipykernel = "^6.29.5"
torchmetrics = "^1.9.0"
keras = { version = "^3.13.1" }
tensorflow = { version = "^2.21.0", markers = "python_version < '3.14'" }
torch = { version = "^2.15.0" }

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipython = "^8.34.0"
pdbpp = "^0.10.3"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=7.2.1,<10.0.0"
pylint = "4.0.9"
pytest-cov = "4.0.0"
matplotlib = "^3.7.0"
qibocal = { git = "https://github.com/qiboteam/qibocal" }
qibolab = { git = "https://github.com/qiboteam/qibolab", extras = ["emulator"] }
jax = "^0.12.0"
jaxlib = "^0.12.0"
keras = "^3.15.1"
tensorflow = { version = "^2.21.0", markers = "python_version < '3.14'" }
torch = { version = "^2.7.0" }
qibotn = {git = "https://github.com/qiboteam/qibotn", platform = "linux || darwin" }
quimb = {version="^1.11.2", platform = "linux || darwin"}
cotengra = {version="^0.7.5", platform = "linux || darwin"}
kahypar = {version="^1.3.5", platform = "linux || darwin"}

[tool.poetry.group.cuda11]
optional = true

[tool.poetry.group.cuda11.dependencies]
jax = { extras = ["cuda11"], version = "^0.12.0" }

[tool.poetry.group.cuda12]
optional = true

[tool.poetry.group.cuda12.dependencies]
jax = { extras = ["cuda12"], version = "^0.12.0" }

[tool.poetry.group.qibocal]
optional = true

[tool.poetry.group.qibocal.dependencies]
qibocal = { git = "https://github.com/qiboteam/qibocal" }

[tool.poe.tasks]
test = "pytest"
lint = "pylint src/**/*.py -E"
lint-warnings = "pylint src/**/*.py --exit-zero"
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.coverage.run]
omit = ["src/qiboml/quantum_info/*", "src/qiboml/models/calibrator.py"]

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = [
  '--cov=qiboml',
  '--cov-append',
  '--cov-report=xml',
  '--cov-report=html',
  '--durations=60',
  '--ignore=tests/test_calibrator.py',
]

[tool.poetry.extras]
torch = ["torch"]
keras = ["tensorflow", "keras"]
